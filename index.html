<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>FISSI-PORTAL — Faith International Secondary School, Itobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1F3B; --navy-deep:#081729; --wine:#6E1F2E; --wine-deep:#551723;
    --gold:#C9A24B; --gold-soft:#E4CE95; --parch:#F6F1E4; --ink:#1C1712;
    --line:#d8cfb8;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--parch); color:var(--ink); font-family:'Source Sans 3', system-ui, sans-serif; -webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:'Playfair Display', serif; margin:0;}
  a{color:inherit;}

  /* ---------- topbar ---------- */
  header.topbar{background:var(--navy); border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:20;}
  .topbar-inner{max-width:960px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px;}
  .crest{width:34px; height:34px; border-radius:50%; background:var(--gold); color:var(--navy-deep); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:800; font-size:15px; flex-shrink:0;}
  .brand-name{color:var(--gold-soft); font-weight:700; font-size:14px; line-height:1.25;}
  .brand-name small{display:block; color:#c9c3b0; font-weight:400; font-size:11px;}
  .logout-btn{background:var(--wine); color:var(--parch); border:none; border-radius:7px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer;}
  .logout-btn:active{background:var(--wine-deep);}

  /* ---------- layout ---------- */
  main{max-width:960px; margin:0 auto; padding:20px 16px 60px;}
  .toast{position:fixed; top:14px; left:16px; right:16px; z-index:60; background:var(--navy); color:var(--parch); border-radius:9px; padding:12px 16px; font-size:13.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.3); max-width:420px; margin:0 auto; text-align:center; opacity:0; transform:translateY(-8px); transition:opacity .25s, transform .25s; pointer-events:none;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--wine);}

  /* ---------- login screen ---------- */
  .login-wrap{min-height:calc(100vh - 60px); display:flex; align-items:center; justify-content:center; padding:20px 16px;}
  .login-card{width:100%; max-width:380px; background:#fffdf8; border:1px solid var(--line); border-radius:14px; padding:28px 24px; box-shadow:0 12px 32px rgba(11,31,59,.12);}
  .login-eyebrow{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--wine); margin-bottom:6px;}
  .login-card h1{font-size:22px; color:var(--navy); margin-bottom:4px; line-height:1.2;}
  .login-sub{font-size:13px; color:#5c5346; margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field-label{display:block; font-size:11px; font-weight:700; letter-spacing:.02em; color:var(--navy); margin-bottom:5px; text-transform:uppercase;}
  .input{width:100%; border-radius:7px; border:1px solid var(--line); background:#fffdf8; padding:11px 12px; font-size:15px; color:var(--ink);}
  .input:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}
  .btn{width:100%; border:none; border-radius:8px; padding:12px 16px; font-size:14.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .btn.primary{background:var(--wine); color:var(--parch);}
  .btn.primary:active{background:var(--wine-deep);}
  .btn.primary:disabled{opacity:.6;}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--navy); margin-top:10px;}
  .form-msg{font-size:13px; margin-top:12px; text-align:center; color:var(--wine); font-weight:600;}
  .switch-note{text-align:center; font-size:13px; margin-top:16px; color:#5c5346;}
  .switch-note button{background:none; border:none; color:var(--wine); font-weight:700; text-decoration:underline; cursor:pointer; font-size:inherit; padding:0;}

  /* ---------- dashboard shell ---------- */
  .greet{margin-bottom:18px;}
  .greet .eyebrow{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--wine);}
  .greet h1{font-size:24px; color:var(--navy); margin-top:4px;}
  .role-pill{display:inline-block; background:var(--navy); color:var(--gold-soft); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 10px; border-radius:20px; margin-top:8px;}

  .tabs{display:flex; gap:6px; overflow-x:auto; margin:18px 0 14px; padding-bottom:2px;}
  .tab{flex-shrink:0; background:transparent; border:1.5px solid var(--line); color:var(--navy); font-weight:700; font-size:12.5px; padding:8px 14px; border-radius:20px; cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--navy); color:var(--gold-soft); border-color:var(--navy);}

  .card{background:#fffdf8; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px;}
  .card h3{font-size:15px; color:var(--navy); margin-bottom:2px;}
  .card .meta{font-size:12px; color:#7a715f; margin-bottom:10px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #ece5d3;}
  .row:last-child{border-bottom:none;}
  .row-main{min-width:0;}
  .row-main .name{font-weight:700; font-size:14px; color:var(--ink);}
  .row-main .sub{font-size:12px; color:#7a715f; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-actions{display:flex; gap:6px; flex-shrink:0;}
  .chip-btn{border:none; border-radius:6px; padding:7px 11px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .chip-btn.approve{background:#2f6b3f; color:#fff;}
  .chip-btn.reject{background:var(--wine); color:#fff;}
  .empty{text-align:center; padding:34px 16px; color:#7a715f; font-size:13.5px;}
  .empty b{display:block; color:var(--navy); font-size:15px; margin-bottom:4px; font-family:'Playfair Display',serif;}
  .loading{text-align:center; padding:30px; color:#7a715f; font-size:13px;}

  .stub h2{font-size:16px; color:var(--navy); margin-bottom:6px;}
  .stub p{font-size:13.5px; color:#5c5346; line-height:1.5;}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="crest">FI</div>
      <div class="brand-name">FISSI-PORTAL<small>Faith Intl. Secondary School, Itobe</small></div>
    </div>
    <button id="logoutBtn" class="logout-btn" style="display:none;">Log out</button>
  </div>
</header>

<main id="app"></main>

<script>
/* ============================================================
   FISSI-PORTAL frontend — talks to the live Node/Express API.
   ============================================================ */
const API_BASE = "https://fissi-portal-backend-zi8i.onrender.com";

const state = {
  token: localStorage.getItem("fissi_token") || null,
  user: JSON.parse(localStorage.getItem("fissi_user") || "null"),
  tab: "pending",
};

function toast(msg, isError){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove("show"), 3200);
}

async function api(path, opts={}){
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (state.token) headers.Authorization = "Bearer " + state.token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) {
    const msg = (data && (data.error || data.message)) || ("Request failed (" + res.status + ")");
    throw new Error(msg);
  }
  return data;
}

function setSession(token, user){
  state.token = token; state.user = user;
  localStorage.setItem("fissi_token", token);
  localStorage.setItem("fissi_user", JSON.stringify(user));
}
function clearSession(){
  state.token = null; state.user = null;
  localStorage.removeItem("fissi_token");
  localStorage.removeItem("fissi_user");
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  clearSession();
  render();
});

/* ---------- login screen ---------- */
function renderLogin(){
  document.getElementById("logoutBtn").style.display = "none";
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-eyebrow">Staff &amp; Admin Sign In</div>
        <h1>Welcome back</h1>
        <div class="login-sub">Sign in to manage FISSI-PORTAL.</div>
        <form id="loginForm">
          <div class="field">
            <label class="field-label">Email</label>
            <input class="input" type="email" id="loginEmail" required autocomplete="username" />
          </div>
          <div class="field">
            <label class="field-label">Password</label>
            <input class="input" type="password" id="loginPassword" required autocomplete="current-password" />
          </div>
          <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
        </form>
        <div id="loginMsg" class="form-msg" style="display:none;"></div>
        <div class="switch-note">New staff account? <button id="showSignup">Request access</button></div>
      </div>
    </div>
  `;
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");
    const msg = document.getElementById("loginMsg");
    msg.style.display = "none";
    btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const data = await api("/api/auth/login", { method:"POST", body: JSON.stringify({ email, password }) });
      setSession(data.token, data.user);
      toast("Welcome, " + (data.user.fullName || data.user.email));
      render();
    } catch(err){
      msg.textContent = err.message;
      msg.style.display = "block";
    } finally {
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });
  document.getElementById("showSignup").addEventListener("click", renderSignup);
}

/* ---------- signup screen ---------- */
function renderSignup(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-eyebrow">Request Access</div>
        <h1>Create an account</h1>
        <div class="login-sub">An admin will review and approve your account before you can sign in.</div>
        <form id="signupForm">
          <div class="field">
            <label class="field-label">Full name</label>
            <input class="input" type="text" id="suName" required />
          </div>
          <div class="field">
            <label class="field-label">Email</label>
            <input class="input" type="email" id="suEmail" required />
          </div>
          <div class="field">
            <label class="field-label">Password</label>
            <input class="input" type="password" id="suPassword" required minlength="6" />
          </div>
          <div class="field">
            <label class="field-label">Role</label>
            <select class="input" id="suRole">
              <option value="TEACHER">Teacher</option>
              <option value="CASHIER">Cashier</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
          <button class="btn primary" type="submit" id="signupBtn">Request access</button>
          <button class="btn ghost" type="button" id="backToLogin">Back to sign in</button>
        </form>
        <div id="signupMsg" class="form-msg" style="display:none;"></div>
      </div>
    </div>
  `;
  document.getElementById("backToLogin").addEventListener("click", renderLogin);
  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fullName = document.getElementById("suName").value.trim();
    const email = document.getElementById("suEmail").value.trim();
    const password = document.getElementById("suPassword").value;
    const role = document.getElementById("suRole").value;
    const btn = document.getElementById("signupBtn");
    const msg = document.getElementById("signupMsg");
    msg.style.display = "none";
    btn.disabled = true; btn.textContent = "Submitting…";
    try {
      await api("/api/auth/signup", { method:"POST", body: JSON.stringify({ fullName, email, password, role }) });
      toast("Request submitted. Awaiting admin approval.");
      renderLogin();
    } catch(err){
      msg.textContent = err.message;
      msg.style.display = "block";
    } finally {
      btn.disabled = false; btn.textContent = "Request access";
    }
  });
}

/* ---------- dashboard shell ---------- */
function renderDashboard(){
  document.getElementById("logoutBtn").style.display = "inline-flex";
  const app = document.getElementById("app");
  const u = state.user;
  const isAdmin = u.role === "ADMIN";

  app.innerHTML = `
    <div class="greet">
      <div class="eyebrow">Dashboard</div>
      <h1>${u.fullName || u.email}</h1>
      <span class="role-pill">${u.role}</span>
    </div>
    ${isAdmin ? `
      <div class="tabs">
        <button class="tab ${state.tab==='pending'?'active':''}" data-tab="pending">Pending Signups</button>
        <button class="tab ${state.tab==='users'?'active':''}" data-tab="users">All Users</button>
      </div>
      <div id="tabContent"></div>
    ` : `
      <div class="card stub">
        <h2>${u.role.charAt(0) + u.role.slice(1).toLowerCase()} tools</h2>
        <p>Your account is approved and signed in. Role-specific tools for ${u.role.toLowerCase()}s are the next thing to wire up to this dashboard.</p>
      </div>
    `}
  `;

  if (isAdmin) {
    app.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        state.tab = btn.dataset.tab;
        renderDashboard();
      });
    });
    if (state.tab === "pending") loadPendingSignups();
    else loadAllUsers();
  }
}

async function loadPendingSignups(){
  const el = document.getElementById("tabContent");
  el.innerHTML = `<div class="loading">Loading pending signups…</div>`;
  try {
    const data = await api("/api/admin/signups/pending");
    const list = data.signups || [];
    if (!list.length){
      el.innerHTML = `<div class="card"><div class="empty"><b>All caught up</b>No signup requests are waiting for review.</div></div>`;
      return;
    }
    el.innerHTML = `<div class="card">` + list.map(s => `
      <div class="row">
        <div class="row-main">
          <div class="name">${s.fullName}</div>
          <div class="sub">${s.email} · ${s.role}</div>
        </div>
        <div class="row-actions">
          <button class="chip-btn approve" data-id="${s.id}" data-action="APPROVED">Approve</button>
          <button class="chip-btn reject" data-id="${s.id}" data-action="REJECTED">Reject</button>
        </div>
      </div>
    `).join("") + `</div>`;
    el.querySelectorAll(".chip-btn").forEach(btn => {
      btn.addEventListener("click", () => decideSignup(btn.dataset.id, btn.dataset.action));
    });
  } catch(err){
    el.innerHTML = `<div class="card"><div class="empty"><b>Couldn't load signups</b>${err.message}</div></div>`;
  }
}

async function decideSignup(id, action){
  try {
    await api(`/api/admin/signups/${id}`, { method:"PATCH", body: JSON.stringify({ decision: action }) });
    toast(action === "APPROVED" ? "Account approved." : "Account rejected.");
    loadPendingSignups();
  } catch(err){
    toast(err.message, true);
  }
}

async function loadAllUsers(){
  const el = document.getElementById("tabContent");
  el.innerHTML = `<div class="loading">Loading users…</div>`;
  try {
    const data = await api("/api/admin/users");
    const list = data.users || [];
    if (!list.length){
      el.innerHTML = `<div class="card"><div class="empty"><b>No users yet</b></div></div>`;
      return;
    }
    el.innerHTML = `<div class="card">` + list.map(u => `
      <div class="row">
        <div class="row-main">
          <div class="name">${u.fullName}</div>
          <div class="sub">${u.email} · ${u.role} · ${u.signupStatus}</div>
        </div>
      </div>
    `).join("") + `</div>`;
  } catch(err){
    el.innerHTML = `<div class="card"><div class="empty"><b>Couldn't load users</b>${err.message}</div></div>`;
  }
}

/* ---------- boot ---------- */
function render(){
  if (state.token && state.user) renderDashboard();
  else renderLogin();
}
render();
</script>
</body>
</html>
